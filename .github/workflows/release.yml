name: Release

# The three modules share one version. The core tag vX.Y.Z releases all of
# them: this run validates the core and both framework modules at the tagged
# commit and, only once every check has passed, tags grpc/vX.Y.Z and
# connectrpc/vX.Y.Z on the same commit and publishes the three releases. See
# AGENTS.md, "Release Process".
#
# grpc/v* and connectrpc/v* are in the trigger so that a framework tag pushed
# by hand is refused rather than left a Go version with no run. The framework
# tags this workflow creates use GITHUB_TOKEN, which starts no workflow, so
# they never reach that refusal; a token that does start workflows would.
on:
  push:
    tags: ['v*', 'grpc/v*', 'connectrpc/v*']

permissions:
  contents: read

# One release at a time; a release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FRAMEWORKS: grpc connectrpc

jobs:
  # Everything that can refuse the release, with read-only access. Nothing it
  # does makes a version visible: the core is fetched from the repository, not
  # through the module proxy, and the framework tags it creates are local.
  validate:
    name: Validate ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      path: ${{ steps.tag.outputs.path }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      latest: ${{ steps.previous.outputs.latest }}
      previous: ${{ steps.previous.outputs.previous }}
    steps:
      - name: Refuse a framework tag
        if: ${{ !startsWith(github.ref_name, 'v') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "::error::$TAG: a framework tag is created by the core release, on the core tag's commit. Delete this tag at once (git push origin :refs/tags/$TAG) and push the core tag instead."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Every branch and tag: the tagged commit is checked against
          # origin/develop, and each module's tags against each other.
          fetch-depth: 0
          persist-credentials: false

      # The three go directives are kept equal, so the core's is the one the
      # modules are checked and tested with here.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The one parse of the tag: the later steps read its outputs and never
      # re-derive them from the ref.
      - name: Classify the tag
        id: tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # A version is v + SemVer 2.0.0 without build metadata, with major 0
          # or 1: the module paths carry no /vN suffix, which Go requires from
          # v2 on.
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${ident}(\.${ident})*)?$"
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "::error::$VERSION is not v followed by a SemVer version without build metadata"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          if ! [[ "$major" =~ ^[01]$ ]]; then
            echo "::error::$VERSION needs a /v$major module path, which this repository does not have"
            exit 1
          fi

          path="$(awk '$1 == "module" { print $2; exit }' go.mod)"
          if [[ "$VERSION" == *-* ]]; then prerelease=true; else prerelease=false; fi

          {
            echo "version=$VERSION"
            echo "path=$path"
            echo "prerelease=$prerelease"
            echo "semver=$semver"
          } >> "$GITHUB_OUTPUT"

      # Releases are cut from develop. The checkout above fetched every branch,
      # so origin/develop is the remote's develop at the time of this run.
      - name: Check that the tagged commit is on develop
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/develop > /dev/null; then
            echo "::error::origin/develop was not fetched"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/develop; then
            echo "::error::$GITHUB_SHA is not on develop: tag a commit of develop"
            exit 1
          fi

      # A framework module's go.mod is what a consumer gets, and its replace
      # does not reach them: it must require exactly the version released
      # with it. The release-cut pull request sets it before the tag. Their go
      # directive is the core's, the one this job tests them with.
      - name: Check the framework modules' go.mod
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CORE: ${{ steps.tag.outputs.path }}
        run: |
          refused=false
          core_go="$(go mod edit -json | jq -r .Go)"
          for dir in $FRAMEWORKS; do
            go="$(cd "$dir" && go mod edit -json | jq -r .Go)"
            if [ "$go" != "$core_go" ]; then
              echo "::error file=$dir/go.mod::$dir has go $go, and the core go $core_go: keep the three go directives equal"
              refused=true
            fi
            required="$(cd "$dir" && go mod edit -json | jq -r --arg core "$CORE" '.Require[] | select(.Path == $core) | .Version')"
            if [ "$required" != "$VERSION" ]; then
              echo "::error file=$dir/go.mod::$dir requires core ${required:-nothing}, not $VERSION: delete the tag, raise the require in a pull request (go mod edit -require=$CORE@$VERSION in $FRAMEWORKS), then tag again"
              refused=true
            fi
          done
          if [ "$refused" = true ]; then exit 1; fi

      # A framework tag of this version already on another commit would split
      # the release; on this commit it is a run being repeated. Absent, it is
      # created here locally, so that the release notes lookup below sees it.
      - name: Check the framework tags
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          for dir in $FRAMEWORKS; do
            tag="$dir/$VERSION"
            if at="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}")"; then
              if [ "$at" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already names $at, not $GITHUB_SHA"
                exit 1
              fi
              echo "$tag already names this commit"
            else
              git tag "$tag" "$GITHUB_SHA"
            fi
          done

      # Each module's release notes start at its previous full release: the
      # first valid tag with no prerelease suffix that sorts below this one.
      # Only the newest full core release is marked as the repository's
      # latest, so neither a framework release nor a patch to an older minor
      # line takes that mark.
      - name: Find each module's previous release
        id: previous
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          SEMVER: ${{ steps.tag.outputs.semver }}
        run: |
          valid() { [[ "$1" =~ $SEMVER ]] && [[ "${BASH_REMATCH[1]}" =~ ^[01]$ ]]; }
          previous=()
          for prefix in "" $(printf '%s/ ' $FRAMEWORKS); do
            # 'v*' lists only the core's tags: a framework tag starts with
            # its directory.
            tags="$(git -c versionsort.suffix=- tag -l "${prefix}v*" --sort=-v:refname \
              | while read -r t; do if valid "${t#"$prefix"}"; then echo "$t"; fi; done)"
            tag="$prefix$VERSION"
            found="$(awk -v tag="$tag" 'seen && $0 !~ /-/ { print; exit } $0 == tag { seen = 1 }' <<< "$tags")"
            echo "$tag: previous release ${found:-none}"
            previous+=("$tag=$found")
            if [ -z "$prefix" ]; then newest="$(grep -v -- '-' <<< "$tags" | head -n 1)"; fi
          done
          if [ "$PRERELEASE" = false ] && [ "$newest" = "$VERSION" ]; then latest=true; else latest=false; fi
          echo "latest: $latest"
          {
            echo "previous=${previous[*]}"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Vet and test
        run: |
          for dir in . $FRAMEWORKS; do
            echo "::group::$dir"
            (cd "$dir" && go vet ./... && go test ./... -race -count=1)
            echo "::endgroup::"
          done

      # A framework module builds against the checkout's core (replace => ../),
      # but a consumer gets the core version its go.mod requires. So each is
      # built and tested against the tagged core with the replace dropped. The
      # core is fetched from the repository (GOPRIVATE), not through the module
      # proxy, which would make the version permanent before this job passes.
      - name: Build and test against the tagged core
        env:
          CORE: ${{ steps.tag.outputs.path }}
          GOPRIVATE: ${{ steps.tag.outputs.path }}
        run: |
          for dir in $FRAMEWORKS; do
            echo "::group::$dir"
            (
              cd "$dir"
              go mod edit -dropreplace="$CORE"
              go mod download "$CORE"
              go build ./...
              go vet ./...
              go test ./... -count=1
            )
            echo "::endgroup::"
          done

  # Runs only once validate has passed. Each step skips what an earlier run of
  # this release already did, so a failed run is finished by re-running it.
  publish:
    name: Publish ${{ github.ref_name }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Tag the framework modules
        run: |
          for dir in $FRAMEWORKS; do
            tag="$dir/$VERSION"
            if at="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2> /dev/null)"; then
              if [ "$at" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already names $at, not $GITHUB_SHA"
                exit 1
              fi
              echo "$tag already names this commit"
            else
              gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" > /dev/null
              echo "created $tag"
            fi
          done

      # A tag with a SemVer prerelease suffix (vX.Y.Z-rc.1) is a prerelease,
      # and only the core's full release may be marked as the latest: a
      # framework release says --latest=false, or the last created would take
      # the mark.
      - name: Create the GitHub Releases
        env:
          PREVIOUS: ${{ needs.validate.outputs.previous }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          for entry in $PREVIOUS; do
            tag="${entry%%=*}"
            previous="${entry#*=}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag already has a release"
              continue
            fi
            latest=false
            if [ "$tag" = "$VERSION" ]; then latest="$LATEST"; fi
            args=(--verify-tag --title "$tag" --generate-notes "--latest=$latest")
            if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$tag" "${args[@]}"
          done

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # Ask the module proxy for each version, so consumers and pkg.go.dev see
      # it without waiting for the first `go get`. The proxy may answer "not
      # found" for a while for a tag it looked up just before it existed, so
      # it is asked again for up to 30 minutes. A version it still has not
      # seen is a warning, not a failure: it is valid, and the first `go get`
      # fetches it.
      - name: Warm the module proxy
        working-directory: ${{ runner.temp }}
        env:
          GOPROXY: proxy.golang.org
          CORE: ${{ needs.validate.outputs.path }}
        run: |
          pending=("$CORE@$VERSION")
          for dir in $FRAMEWORKS; do pending+=("$CORE/$dir@$VERSION"); done
          for attempt in $(seq 1 30); do
            left=()
            for module in "${pending[@]}"; do
              if go list -m "$module" > /dev/null 2>&1; then echo "proxy has $module"; else left+=("$module"); fi
            done
            pending=("${left[@]}")
            if [ "${#pending[@]}" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 30 ]; then sleep 60; fi
          done
          for module in "${pending[@]}"; do
            echo "::warning::the module proxy does not have $module yet; ask again with: GOPROXY=proxy.golang.org go list -m $module"
          done
