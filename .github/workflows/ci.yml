name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.module.name }}, ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { name: core, dir: . }
          - { name: grpc, dir: grpc }
          - { name: connectrpc, dir: connectrpc }
        # "minimum" is the module's go directive, the oldest toolchain a
        # consumer may build with; oldstable and stable are the two releases
        # the Go team still supports.
        go: [minimum, oldstable, stable]
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go != 'minimum' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'minimum' && format('{0}/go.mod', matrix.module.dir) || '' }}
      - run: go version

      # Formatting, static analysis and module tidiness are properties of the
      # source, so each module is checked once, on the minimum toolchain: the
      # pinned staticcheck supports it, and gofmt and go mod tidy can answer
      # differently on a newer one.
      - name: Check formatting
        if: matrix.go == 'minimum'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check that go.mod and go.sum are tidy
        if: matrix.go == 'minimum'
        run: go mod tidy -diff
      - name: staticcheck
        if: matrix.go == 'minimum'
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - run: go vet ./...
      - run: go test ./... -race -count=1 -covermode=atomic -coverprofile=cover.out

      # One report per module, from the minimum toolchain; codecov.yml carries
      # each flag forward when a run does not upload it.
      - name: Upload coverage to Codecov (${{ matrix.module.name }})
        if: matrix.go == 'minimum'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.module.dir }}/cover.out
          flags: ${{ matrix.module.name }}
          disable_search: true
          fail_ci_if_error: false

  proto-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install protoc
        # From the release asset rather than a setup action: there is no API
        # lookup to be rate-limited, and no action runtime to fall out of support.
        env:
          PROTOC_VERSION: "34.0"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
      - name: Generate
        run: make -C schema generate
      - name: Check for drift
        run: git diff --exit-code schema/
